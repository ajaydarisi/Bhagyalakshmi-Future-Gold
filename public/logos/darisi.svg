  <title id="title">DARISI</title>
  <desc id="desc">DARISI wordmark constructed on a golden-ratio grid</desc>
  <!--
    Let H = 256 and φ = 1.61803398875.
    The DARISI glyphs occupy exactly 2φH × H (828.433402 × 256), followed
    by a fixed contrast dot.
    The D is the original Darisi path, uniformly scaled to an H/φ-wide
    module. The remaining sequence is [H/5, H/φ², H/5, H/φ², H/5,
    H/φ³, H/5, H/φ², H/5, H/φ³].
  -->
